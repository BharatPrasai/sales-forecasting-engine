name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn statsmodels matplotlib joblib fastapi uvicorn pydantic pytest httpx

      - name: Run Diagnostics & Feature Engineering Pipeline
        run: |
          python src/generate_data.py
          python src/train_models.py

      - name: Run Pytest Suite
        run: |
          python -m pytest -v -W ignore::DeprecationWarning